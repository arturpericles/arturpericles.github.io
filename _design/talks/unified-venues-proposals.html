<script>
(()=>{
 const root=document.getElementById('talks-unified-venues');
 const records=JSON.parse(document.getElementById('uv-data').textContent);
 const years=[...new Set(records.map(r=>r.year))];
 function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n;}
 function link(text,url,cls){const a=el('a',text,cls);a.href=url;if(!url.startsWith('#')){a.target='_blank';a.rel='noopener noreferrer';}return a;}
 function date(r){const n=el('time',r.date.replace(', '+r.year,''),'uv-date');n.dateTime=r.iso;n.setAttribute('aria-label',r.date);return n;}
 function paper(r,full){const text=full?(r.paperTitle||r.title):r.shortTitle;const n=r.paperUrl?link(text,r.paperUrl,'uv-paper-title'):el('span',text,'uv-paper-title');if(r.paperUrl)n.setAttribute('aria-label',text+' — publication page');return n;}
 function resource(r){const label=r.linkLabel==='Watch recording'?'Recording':r.linkLabel;const a=link(label,r.link,'uv-resource');a.setAttribute('aria-label',label+' — '+r.venueLabel+', '+r.date);return a;}
 function venue(r,heading=true){const body=el('div');body.append(el(heading?'h3':'p',r.venueLabel));if(r.host)body.append(el('p',r.host,'uv-host'));return body;}
 function contribution(r,full){
  const p=el('p',null,'uv-contribution');p.append(el('span',(r.scheduled?'Scheduled · ':'')+r.role,'uv-kind'));
  if(r.kind==='Paper presentation'){p.append(' · ',paper(r,full));}
  else if(r.contributionTitle){p.append(' · ',el('span',r.contributionTitle));}
  if(r.link)p.append(' · ',resource(r));return p;
 }
 function row(r,full){const li=el('li',null,'uv-row'),body=venue(r);li.dataset.record=r.id;body.append(contribution(r,full));li.append(body,date(r));return li;}
 function grouped(records){const groups=[];const seen=new Map();for(const r of records){if(r.kind==='Paper presentation'){const key=r.paperTitle||r.title;if(seen.has(key)){seen.get(key).push(r);}else{const group=[r];seen.set(key,group);groups.push(group);}}else groups.push([r]);}return groups;}
 for(const page of root.querySelectorAll('.uv-page')){
  const layout=page.dataset.layout,host=page.querySelector('.uv-records'),jumps=page.querySelector('.uv-jumps'),menu=page.querySelector('.uv-menu');
  for(const label of ['Bio','Publications','Teaching','Talks']){const a=link(label,'https://arturpericles.art/'+label.toLowerCase()+'/');if(label==='Talks')a.setAttribute('aria-current','page');menu.append(a);}
  for(const year of years)jumps.append(link(year,'#uv-'+layout+'-'+year));
  const state={fullTitles:false,spacing:15};
  function render(){
   host.replaceChildren();page.style.setProperty('--uv-gap',state.spacing+'px');
   for(const year of years){
    const section=el('section',null,layout==='register'?'uv-register-year':'uv-year');section.id='uv-'+layout+'-'+year;section.setAttribute('aria-label',year);section.append(el('h2',year));
    const entries=records.filter(r=>r.year===year);
    if(layout==='register'){
     const table=el('table');table.setAttribute('aria-label','Appearances in '+year);const thead=el('thead'),header=el('tr');for(const title of ['Venue','Contribution','Date']){const th=el('th',title);th.scope='col';header.append(th);}thead.append(header);const tbody=el('tbody');
     for(const r of entries){const tr=el('tr');tr.dataset.record=r.id;const a=el('td'),b=el('td'),c=el('td');a.append(venue(r));b.append(contribution(r,state.fullTitles));c.append(date(r));tr.append(a,b,c);tbody.append(tr);}table.append(thead,tbody);section.append(table);
    }else{
     const list=el('ul',null,'uv-list');
     if(layout==='record')list.append(...entries.map(r=>row(r,state.fullTitles)));
     else for(const group of grouped(entries)){
      const r=group[0];if(r.kind!=='Paper presentation'){list.append(row(r,state.fullTitles));continue;}
      const li=el('li',null,'uv-bundle'),heading=el('p',null,'uv-bundle-title');heading.append(paper(r,state.fullTitles));li.append(el('span','Paper presentation','uv-kind'),heading);
      const venues=el('ul',null,'uv-bundle-list');for(const appearance of group){const sub=el('li',null,'uv-bundle-venue');sub.dataset.record=appearance.id;const v=venue(appearance,false);if(appearance.link)v.append(resource(appearance));sub.append(v,date(appearance));venues.append(sub);}li.append(venues);list.append(li);
     }
     section.append(list);
    }
    host.append(section);
   }
  }
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:page,onChange:render});tweak.addToggle(state,'fullTitles',{label:'Full paper titles'});tweak.addSlider(state,'spacing',{label:'Space between entries',min:9,max:21,step:2,unit:'px'});}
 }
})();
