project:
  type: website
  output-dir: docs
  resources:
    - CNAME
  preview:
    port: 4200
    browser: false
  post-render:
    - scripts/post-render.sh
website:
  title: 'Artur Pericles L. Monteiro'
  description: 'Artur Pericles L. Monteiro | Law Professor, AI & Technology'
  site-url: 'https://www.arturpericles.art'
  page-navigation: true
  page-footer:
    center: "[Made with [Quarto](https://quarto.org) with a modified [Canelón-adapted](https://github.com/spcanelon/silvia) Hugo [Apero theme](https://github.com/hugo-apero)]{.small}"
    right:
      - href: accessibility.md
        text: Accessibility
  # favicon: media/api-favicon.png
  navbar:
    title: ARTUR PERICLES L. MONTEIRO
    right:
      # - href: index.md
      #   text: Home
      - href: bio/
        text: Bio
      - href: publications/
        text: Publications
      - href: teaching/
        text: Teaching
      - href: talks/
        text: Talks
  sidebar:
    - id: torts
      title: "Torts · Fall 2026"
      style: floating
      collapse-level: 1
      contents:
        - href: teaching/torts/index.md
          text: Overview
        - href: teaching/torts/schedule.md
          text: Schedule
        - href: teaching/torts/policies.md
          text: Course Policies
        - href: /teaching/torts/syllabus.pdf
          text: 'Syllabus <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>'
  open-graph:
    image: /media/seymour-march-sm.webp
    description: 'Artur Pericles L. Monteiro | Law Professor, AI & Technology'
  twitter-card:
    creator: "@arturpericles"
    image: /media/seymour-march-sm.webp
    description: 'Artur Pericles L. Monteiro | Law Professor, AI & Technology'
format:
  html:
    theme:
      light:
        # - cosmo
        - assets/theme.scss
        # - assets/silvia/colors-light.scss
        - assets/fonts.scss
    pagetitle: '{{< meta title >}}'
    description-meta: 'Artur Pericles L. Monteiro | Law Professor, AI & Technology'
    canonical-url: true
    lightbox: true
    include-in-header:
      - text: '<meta name="navbar-short-title" content="A.P.L. Monteiro">'
    include-after-body:
      - text: |
          <script>
          document.addEventListener('DOMContentLoaded', function() {
            var meta = document.querySelector('meta[name="navbar-short-title"]');
            var el = document.querySelector('.navbar-title');
            var brand = document.querySelector('.navbar-brand');
            if (meta && el) el.setAttribute('data-short-title', meta.content);
            if (brand) brand.setAttribute('aria-label', 'Artur Pericles L. Monteiro — Home');
            if (document.body.classList.contains('course-page')) {
              var secondaryNav = document.querySelector('.quarto-secondary-nav');
              var courseMenuLabel = secondaryNav && secondaryNav.querySelector('.breadcrumb-item');
              var courseMenuToggle = secondaryNav && secondaryNav.querySelector('.quarto-btn-toggle');
              var courseMenuBreadcrumbs = secondaryNav && secondaryNav.querySelector('.quarto-page-breadcrumbs');
              if (courseMenuLabel) courseMenuLabel.textContent = 'Course Menu';
              if (courseMenuToggle) courseMenuToggle.setAttribute('aria-label', 'Toggle course menu');
              if (courseMenuBreadcrumbs) courseMenuBreadcrumbs.setAttribute('aria-label', 'Course menu');
            }
          });
          </script>
csl: aplm-bluebook-law-review.csl
